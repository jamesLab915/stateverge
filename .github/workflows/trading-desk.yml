# Event desk (phase 1: signals and records only — never places orders).
# Processes "pending" entries in data/trading/requests.json.
name: Trading event desk

on:
  push:
    paths:
      - "data/trading/requests.json"
      - "data/trading/journal.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trading-desk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  desk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Tests
        run: python -m unittest discover -s tests/trading -t .
      - name: Run desk
        env:
          PYTHONPATH: src
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          python -m stateverge.trading.eventdesk --root data/trading | tee desk.log
          { echo '## Event desk'; echo '```'; cat desk.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/trading
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "trading: event desk results"
          git pull --rebase -q origin "${GITHUB_REF_NAME}"
          git push
