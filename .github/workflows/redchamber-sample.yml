# Dream of the Red Chamber — EP01 sample cut via OpenAI Sora.
# Commit a change to data/redchamber/sample_request.json to render; the
# finished cut is committed to media/redchamber/ on the same branch.
name: Red Chamber sample render

on:
  push:
    paths:
      - "data/redchamber/sample_request.json"

permissions:
  contents: write

concurrency:
  group: redchamber-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Render with Sora
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          SHOTS=$(python3 -c "import json;print(','.join(json.load(open('data/redchamber/sample_request.json')).get('shots',[])))")
          MODEL=$(python3 -c "import json;print(json.load(open('data/redchamber/sample_request.json')).get('model','sora-2'))")
          python3 scripts/redchamber/sora_sample.py --shots "$SHOTS" --model "$MODEL" --out media/redchamber | tee render.log || true
          { echo '## Red Chamber sample'; echo '```'; cat render.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: redchamber-clips
          path: media/redchamber/clips/
          if-no-files-found: ignore
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add media/redchamber/report.json
          [ -f media/redchamber/ep01_sample_cut.mp4 ] && git add media/redchamber/ep01_sample_cut.mp4
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "redchamber: EP01 sample render"
          git pull --rebase -q origin "${GITHUB_REF_NAME}"
          git push
