# Political Archive — cloud runner.
# Edit data/archive/collect_requests.json or data/archive/publish_queue.json
# (GitHub web / mobile editor is fine) and commit: this job processes every
# "pending" entry and commits the results back to the same branch.
name: Political Archive cloud run

on:
  push:
    paths:
      - "data/archive/collect_requests.json"
      - "data/archive/publish_queue.json"
      - "data/archive/stats_requests.json"
  # Weekly account snapshot (Monday 13:07 UTC). GitHub only runs schedules for
  # workflows on the default branch, so this activates once merged to main;
  # until then, add {"status": "pending"} to stats_requests.json instead.
  schedule:
    - cron: "7 13 * * 1"
  workflow_dispatch:

permissions:
  contents: write

# Never run two posting jobs at once.
concurrency:
  group: political-archive-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Tests
        run: python -m unittest discover -s tests -t .

      - name: Process queues
        env:
          PYTHONPATH: src
          GOVINFO_API_KEY: ${{ secrets.GOVINFO_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: |
          FLAGS=""
          if [ -n "$OPENAI_API_KEY" ]; then FLAGS="--llm"; fi
          if [ "${{ github.event_name }}" = "schedule" ]; then FLAGS="$FLAGS --stats"; fi
          python -m stateverge.cn_news.archive cloud-run --root data/archive $FLAGS | tee run.log
          { echo '## Political Archive'; echo '```'; cat run.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      # Commits made with GITHUB_TOKEN do not trigger another run.
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/archive
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "archive: cloud run results"
          git push
