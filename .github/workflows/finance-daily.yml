# Stateverge 美国财经日报 — renders one episode per "pending" entry in
# data/finance/requests.json and attaches the mp4 to a GitHub (pre)release.
name: Finance daily render

on:
  push:
    paths:
      - "data/finance/requests.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finance-daily-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ffmpeg, CJK fonts, Pillow
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk
          pip install -q Pillow
      - name: Tests
        run: python -m unittest discover -s tests/finance_daily -t .
      - name: Render
        env:
          PYTHONPATH: src
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RUNWAYML_API_SECRET: ${{ secrets.RUNWAYML_API_SECRET }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FINANCE_SUB_FONT: "Noto Sans CJK SC"
        run: |
          python -m stateverge.finance_daily cloud-run --root data/finance --work finance_build | tee render.log
          { echo '## 美国财经日报'; echo '```'; cat render.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/finance
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "finance: daily render results"
          git pull --rebase -q origin "${GITHUB_REF_NAME}"
          git push
